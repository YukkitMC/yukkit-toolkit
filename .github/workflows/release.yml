name: Publish GitHub Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build and validate JAR
        run: gradle clean build --no-daemon --stacktrace

      - name: Publish regular GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          TAG="v${VERSION}"
          JAR="build/libs/yukkit-toolkit-${VERSION}.jar"
          test -s "$JAR"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --prerelease=false --latest
          else
            gh release create "$TAG" "$JAR" --repo "$REPO" --target "$TARGET_SHA" \
              --title "Yukkit Toolkit ${TAG} · Minecraft 26.3" \
              --notes-file RELEASE_NOTES.md --latest
          fi
