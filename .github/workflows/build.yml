name: Build Fabric Mod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 21 compiler and Java 25 Gradle runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build
        run: gradle clean build --stacktrace --no-daemon
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yukkit-toolkit-fabric-1.21.1
          path: |
            build/libs/yukkit-toolkit-*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
